services:
  mysql:
    image: mysql:8.4
    container_name: powermanagerAPI
    restart: unless-stopped
    environment:
        MYSQL_DATABASE: ${MYSQL_DATABASE}
        MYSQL_USER: ${MYSQL_USER}
        MYSQL_PASSWORD: ${MYSQL_PASSWORD}
        MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - powermanager-mysql-data:/var/lib/mysql

volumes:
  powermanager-mysql-data: